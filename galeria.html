<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>BDN - Galeria</title>
    <link rel="icon" type="image/png" href="bdn_fabicon.png">
    <link rel="shortcut icon" type="image/png" href="bdn_fabicon.png">
    <link rel="apple-touch-icon" href="bdn_fabicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        :root {
            --bg-page: #0a0a0a; /* BDN Brand Black */
            --text-main: #ffffff; /* White */
            --text-muted: rgba(255, 255, 255, 0.6);
            --accent-color: #fccb06; /* BDN Brand Yellow */
            --accent-hover: #e0b505;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body, html {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* Loading Screen styles */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loader-logo-wrap {
            margin-bottom: 2rem;
            position: relative;
        }

        .loader-logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, rgba(252, 203, 6, 0.25) 0%, rgba(252, 203, 6, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(5px);
        }

        .loader-bar-bg {
            width: 160px;
            height: 2px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .loader-bar-fill {
            width: 0%;
            height: 100%;
            background: var(--accent-color);
            position: absolute;
            left: 0;
            top: 0;
            box-shadow: 0 0 8px var(--accent-color);
        }

        /* Custom Cursor */
        .custom-cursor {
            position: fixed;
            width: 16px;
            height: 16px;
            background-color: var(--accent-color);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transition: transform 0.1s ease, background-color 0.3s ease;
            box-shadow: 0 0 15px rgba(252, 203, 6, 0.4);
            opacity: 0; /* Hidden during loader */
        }

        .custom-cursor.hover {
            transform: scale(2);
            background-color: transparent;
            border: 2px solid var(--accent-color);
        }

        /* Header Navigation */
        header {
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            padding: 2.5rem;
            z-index: 999;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-favicon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
        }

        .header-favicon:hover {
            transform: scale(1.08) rotate(15deg);
            border-color: var(--accent-color);
            box-shadow: 0 0 20px rgba(252, 203, 6, 0.3);
        }

        .header-favicon img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        /* Main Content Container */
        .gallery-page-container {
            width: 100vw;
            min-height: 100vh;
            padding: 8rem 5vw 4rem 5vw;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            position: relative;
            z-index: 2;
            opacity: 0; /* Hidden until loaded */
        }

        .gallery-intro {
            text-align: center;
            margin-bottom: 4rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .intro-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 3px;
            line-height: 0.95;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
        }

        .intro-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Recreating the first image section layout from index.html */
        .new-gallery-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4vw;
            align-items: flex-start;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .new-gallery-column {
            display: flex;
            flex-direction: column;
            gap: 4vw;
        }

        .new-gallery-item {
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .new-gallery-img-wrap {
            position: relative;
            width: 100%;
            overflow: hidden;
            border: 3px solid #000;
            background-color: #000;
        }

        /* Circle shape for Center Column */
        .new-gallery-img-wrap.shape-circle {
            border-radius: 50%;
            aspect-ratio: 1/1;
        }

        .new-gallery-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(100%);
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), filter 0.8s ease;
        }

        .new-gallery-item:hover .new-gallery-img {
            transform: scale(1.05);
            filter: grayscale(0%);
        }

        /* Abstract shapes overlays matching index */
        .new-gallery-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-color: var(--accent-color);
            mix-blend-mode: multiply;
            opacity: 0.9;
            transition: opacity 0.8s ease;
        }

        .shape-1 {
            clip-path: polygon(0 0, 50% 0, 0 50%);
        }

        .shape-2 {
            clip-path: polygon(65% 0, 100% 0, 100% 100%, 20% 100%, 65% 65%);
        }

        .shape-3 {
            clip-path: polygon(100% 100%, 50% 100%, 100% 50%);
        }

        .new-gallery-item:hover .new-gallery-overlay {
            opacity: 0;
        }

        /* Labels overlay on hover */
        .new-gallery-info {
            position: absolute;
            bottom: 1.5rem;
            left: 1.5rem;
            z-index: 5;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .new-gallery-item:hover .new-gallery-info {
            opacity: 1;
            transform: translateY(0);
        }

        .info-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            color: var(--accent-color);
            letter-spacing: 1px;
            line-height: 1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .info-category {
            font-size: 0.72rem;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* Back to Site Button */
        .back-btn-wrap {
            text-align: center;
            margin-top: 4rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border: 1px solid var(--border-color);
            padding: 1rem 2rem;
            border-radius: 30px;
            background: rgba(255,255,255,0.02);
        }

        .back-btn:hover {
            color: #000;
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px rgba(252, 203, 6, 0.2);
            transform: translateY(-2px);
        }

        /* Language Toggle Pill */
        .language-toggle {
            position: fixed;
            bottom: 2.5rem;
            left: 2.5rem;
            z-index: 1001;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 4px;
            display: flex;
            gap: 2px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            opacity: 0; /* Animates in after load */
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.7rem;
            padding: 6px 12px;
            border-radius: 30px;
            cursor: none;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background-color: var(--accent-color);
            color: #000;
        }

        /* Responsive Layouts */
        @media (max-width: 768px) {
            .new-gallery-container {
                grid-template-columns: 1fr;
                gap: 8vw;
            }
            .new-gallery-column {
                gap: 8vw;
            }
            .new-gallery-column:nth-child(2) {
                margin-top: 0 !important;
            }
            .gallery-page-container {
                padding-top: 7rem;
            }
            header {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <!-- Loading Screen Component -->
    <div id="loading-screen">
        <div class="loader-logo-wrap">
            <div class="loader-logo-glow"></div>
            <img src="bdn_fabicon.png" alt="BDN Logo" id="loaderLogo" style="width: 54px; height: 54px; filter: drop-shadow(0 0 12px rgba(252, 203, 6, 0.5)); transform: scale(0.6); opacity: 0;">
        </div>
        <div class="loader-bar-bg" id="loaderBarBg" style="opacity: 0; transform: translateY(10px);">
            <div class="loader-bar-fill" id="loaderBarFill"></div>
        </div>
    </div>

    <!-- Custom Cursor -->
    <div class="custom-cursor" id="customCursor"></div>

    <!-- Navigation Header -->
    <header>
        <a href="index.html" class="header-favicon target-cursor-hover" id="logoLink">
            <img src="bdn_fabicon.png" alt="BDN">
        </a>
    </header>

    <!-- Main Container -->
    <div class="gallery-page-container" id="mainContainer">
        <!-- Intro -->
        <div class="gallery-intro">
            <h1 class="intro-title" data-translate="gallery_title">Galeria de Projetos</h1>
            <p class="intro-subtitle" data-translate="gallery_subtitle">PROJETAMOS | ARQUITETAMOS | CONSTRUÍMOS</p>
        </div>

        <!-- 3-Column Layout from index.html (first half) -->
        <div class="new-gallery-container">
            <!-- Coluna Esquerda -->
            <div class="new-gallery-column" style="margin-top: 0;">
                <!-- 1st img: Landscape -->
                <div class="new-gallery-item" style="width: 100%; margin-left: 0;">
                    <div class="new-gallery-img-wrap" style="aspect-ratio: 16/9;">
                        <img src="imagens/arquitetamos/habitacao2.png" alt="Projeto BDN" class="new-gallery-img" />
                        <div class="new-gallery-overlay shape-1"></div>
                        <div class="new-gallery-info">
                            <div class="info-title" data-translate="project_1_title">Villa Alentejo</div>
                            <div class="info-category" data-translate="project_1_cat">Projetamos</div>
                        </div>
                    </div>
                </div>
                <!-- 4th img: Portrait -->
                <div class="new-gallery-item" style="width: 80%; margin-left: 20%;">
                    <div class="new-gallery-img-wrap" style="aspect-ratio: 1/1;">
                        <img src="imagens/arquitetamos/habitacao3.png" alt="Projeto BDN" class="new-gallery-img" />
                        <div class="new-gallery-overlay shape-3"></div>
                        <div class="new-gallery-info">
                            <div class="info-title" data-translate="project_2_title">Espaço Conceito</div>
                            <div class="info-category" data-translate="project_2_cat">Projetamos</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Coluna Meio -->
            <div class="new-gallery-column" style="margin-top: 5vh;">
                <!-- 2nd img (Circle) -->
                <div class="new-gallery-item" style="width: 90%; margin: 0 auto;">
                    <div class="new-gallery-img-wrap shape-circle">
                        <img src="imagens/arquitetamos/habitacao8.png" alt="Projeto BDN" class="new-gallery-img" />
                        <div class="new-gallery-overlay shape-2"></div>
                        <div class="new-gallery-info" style="left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; width: 80%; height: auto; bottom: auto;">
                            <div class="info-title" data-translate="project_3_title">Habitação 3D</div>
                            <div class="info-category" data-translate="project_3_cat">Projetamos</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Coluna Direita -->
            <div class="new-gallery-column" style="margin-top: 0;">
                <!-- 3rd img: Portrait -->
                <div class="new-gallery-item" style="width: 80%; margin-left: 0;">
                    <div class="new-gallery-img-wrap" style="aspect-ratio: 1/1;">
                        <img src="imagens/arquitetamos/habitacao7.png" alt="Projeto BDN" class="new-gallery-img" />
                        <div class="new-gallery-overlay shape-1"></div>
                        <div class="new-gallery-info">
                            <div class="info-title" data-translate="project_4_title">Studio Minimalista</div>
                            <div class="info-category" data-translate="project_4_cat">Projetamos</div>
                        </div>
                    </div>
                </div>
                <!-- 6th img: Landscape -->
                <div class="new-gallery-item" style="width: 100%; margin-left: 0;">
                    <div class="new-gallery-img-wrap" style="aspect-ratio: 16/9;">
                        <img src="imagens/arquitetamos/habitacao4.png" alt="Projeto BDN" class="new-gallery-img" />
                        <div class="new-gallery-overlay shape-3"></div>
                        <div class="new-gallery-info">
                            <div class="info-title" data-translate="project_5_title">Residência Douro</div>
                            <div class="info-category" data-translate="project_5_cat">Projetamos</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>

    <!-- Language Selector Floating -->
    <div class="language-toggle" id="langToggle">
        <button class="lang-btn active target-cursor-hover" id="lang-pt">PT</button>
        <button class="lang-btn target-cursor-hover" id="lang-en">EN</button>
    </div>

    <script>
        // Custom Cursor Movement
        const cursor = document.getElementById('customCursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX - 8 + 'px';
            cursor.style.top = e.clientY - 8 + 'px';
        });

        // Add hover effects for target-cursor-hover
        function updateHoverListeners() {
            const hovers = document.querySelectorAll('.target-cursor-hover');
            hovers.forEach(el => {
                el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
                el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
            });
        }
        updateHoverListeners();

        // GSAP Timeline for Loading Screen and Entrance
        window.addEventListener('load', () => {
            const loadTimeline = gsap.timeline();

            // 1. Initial fade-in of loader elements
            loadTimeline.to('#loaderLogo', {
                duration: 0.6,
                scale: 1,
                opacity: 1,
                ease: 'back.out(1.7)'
            });
            loadTimeline.to('#loaderBarBg', {
                duration: 0.4,
                y: 0,
                opacity: 1,
                ease: 'power2.out'
            }, '-=0.3');

            // 2. Animate the progress bar fill
            loadTimeline.to('#loaderBarFill', {
                duration: 1.2,
                width: '100%',
                ease: 'power3.inOut'
            });

            // 3. Exit loading screen (Scale down logo, fade out loader container)
            loadTimeline.to('#loaderLogo', {
                duration: 0.4,
                scale: 0.7,
                opacity: 0,
                ease: 'power3.in'
            });
            loadTimeline.to('#loading-screen', {
                duration: 0.6,
                yPercent: -100, // Slide loader up curtain-style
                ease: 'power4.inOut'
            }, '-=0.1');

            // 4. Reveal page container & start entrance animations
            loadTimeline.set('#mainContainer', { opacity: 1 }, '-=0.3');
            loadTimeline.set('#customCursor', { opacity: 1 }, '-=0.3');

            // Header navigation fade in
            loadTimeline.from('header', {
                duration: 0.8,
                y: -30,
                opacity: 0,
                ease: 'power3.out'
            }, '-=0.3');

            // Intro fade in
            loadTimeline.from('.gallery-intro > *', {
                duration: 0.9,
                y: 20,
                opacity: 0,
                stagger: 0.15,
                ease: 'power3.out'
            }, '-=0.6');

            // Curtain reveal & scale zoom-out for the gallery items
            loadTimeline.fromTo('.new-gallery-item', {
                scale: 1.12,
                clipPath: 'inset(100% 0 0 0)' // Reveal upward
            }, {
                duration: 1.5,
                scale: 1,
                clipPath: 'inset(0% 0 0 0)',
                stagger: 0.15,
                ease: 'power4.out'
            }, '-=0.8');

            // Fade in Back button and Language Switcher
            loadTimeline.from('.back-btn-wrap', {
                duration: 0.8,
                y: 15,
                opacity: 0,
                ease: 'power3.out'
            }, '-=0.6');

            loadTimeline.to('#langToggle', {
                duration: 0.5,
                opacity: 1,
                ease: 'power2.out'
            }, '-=0.5');
        });

        // Translation Engine
        const translations = {
            pt: {
                gallery_title: "Galeria de Projetos",
                gallery_subtitle: "PROJETAMOS | ARQUITETAMOS | CONSTRUÍMOS",
                back_to_site: "Voltar ao site",
                project_1_title: "Villa Alentejo",
                project_1_cat: "Projetamos",
                project_2_title: "Espaço Conceito",
                project_2_cat: "Projetamos",
                project_3_title: "Habitação 3D",
                project_3_cat: "Projetamos",
                project_4_title: "Studio Minimalista",
                project_4_cat: "Projetamos",
                project_5_title: "Residência Douro",
                project_5_cat: "Projetamos"
            },
            en: {
                gallery_title: "Project Gallery",
                gallery_subtitle: "WE DESIGN | WE ARCHITECT | WE BUILD",
                back_to_site: "Back to home",
                project_1_title: "Alentejo Villa",
                project_1_cat: "We Design",
                project_2_title: "Concept Space",
                project_2_cat: "We Design",
                project_3_title: "3D Housing",
                project_3_cat: "We Design",
                project_4_title: "Minimalist Studio",
                project_4_cat: "We Design",
                project_5_title: "Douro Residence",
                project_5_cat: "We Design"
            }
        };

        let currentLang = localStorage.getItem('bdn_language') || 'pt';

        function updateLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('bdn_language', lang);
            
            document.getElementById('lang-pt').classList.toggle('active', lang === 'pt');
            document.getElementById('lang-en').classList.toggle('active', lang === 'en');
            
            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[lang][key]) {
                    el.innerHTML = translations[lang][key];
                }
            });
        }

        // Initialize language
        updateLanguage(currentLang);

        document.getElementById('lang-pt').addEventListener('click', () => updateLanguage('pt'));
        document.getElementById('lang-en').addEventListener('click', () => updateLanguage('en'));
    </script>
</body>

</html>
